[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-physplot"
version = "1.0.0"
description = "Scientific plotting, workflow recording, and publication-ready plot generation for researchers."
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [
    { name = "M. Shiraz Ahmad" },
]
keywords = [
    "plotting",
    "scientific-visualization",
    "matplotlib",
    "data-analysis",
    "workflow",
    "gui",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "appdirs>=1.4.4",
    "matplotlib>=3.11",
    "numpy>=2.5",
    "openpyxl>=3.1.5",
    "pandas>=3.0",
    "PyQt6>=6.11",
    # Figure Editor (physplot_gui/figure_editor, PhysPlot's PyQt6 copy of FigureForge 0.3.3).
    "requests>=2.34",
    "scipy>=1.18",
    "xlrd>=2.0.2",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pyinstaller>=6.0",
    "pytest>=9.1",
    "twine>=6",
]

[project.scripts]
physplot = "physplot.__main__:main"
physplot-gui = "physplot_gui.app.runner:run_app"
python-physplot = "physplot.__main__:main"
python-physplot-gui = "physplot_gui.app.runner:run_app"

[project.urls]
Homepage = "https://github.com/MShirazAhmad/PhysPlot"
Repository = "https://github.com/MShirazAhmad/PhysPlot"
Issues = "https://github.com/MShirazAhmad/PhysPlot/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["physplot*", "physplot_gui*"]
exclude = ["tests*", "docs*", "outputs*", "workflows*", "test_data*"]

[tool.setuptools.package-data]
physplot = ["inc/*.png"]
"physplot_gui.figure_editor" = ["LICENSE", "structure.json", "resources/**/*", "plugins/*.png", "plugins/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
